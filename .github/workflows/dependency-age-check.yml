name: Dependency age check

on:
  pull_request:
    paths:
      - '**/go.mod'
      - 'go.mod'

permissions:
  contents: read

env:
  # Fail the check if any Go module version introduced by this PR was
  # published within the last N days. Override at the repo level via a
  # repository variable if a different window is needed.
  MIN_DEPENDENCY_AGE_DAYS: ${{ vars.MIN_DEPENDENCY_AGE_DAYS || 14 }}

jobs:
  dependency-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge-base with the PR base branch exists.
          fetch-depth: 0

      - name: Check age of introduced Go module versions
        run: python3 scripts/check_dependency_age.py --base-ref "origin/${GITHUB_BASE_REF}"
